# Render blueprint — static build of the Vite app (site + client portal + CRM).
# Cloud Functions and security rules are deployed separately with Firebase.
services:
  - type: web
    name: kuczewska
    runtime: static
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      # Addresses of the former Wix site that search engines still know.
      - type: redirect
        source: /portfolio
        destination: /#portfolio
      - type: redirect
        source: /o-mnie
        destination: /#about
      - type: redirect
        source: /kontakt
        destination: /#contact
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000
